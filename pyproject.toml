[project]
name = "strideweave"
version = "0.1.0"
description = "Hierarchical-layout tensor and autograd research framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Patrick Krusiec", email = "patrick.krusiec@gmail.com" }
]
requires-python = ">=3.12"
# NumPy supplies the reference binary32 mechanics for Generic Float32 storage
# and arithmetic. It is imported lazily, on first concrete Float32 use, so a
# CPU-only or Int32-only program never loads it.
#
# PyMySQL is the pure-Python parameterized client the verification store uses to
# talk to its internally managed Dolt server. It is imported lazily, on first
# store use, so importing StrideWeave or running a kernel never loads it.
dependencies = [
    "numpy>=1.26",
    "pymysql>=1.1",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/patrickk1998/strideweave"
Issues = "https://github.com/patrickk1998/strideweave/issues"
Repository = "https://github.com/patrickk1998/strideweave.git"

[project.scripts]
strideweave-kernel-status = "strideweave.verification.status_cli:main"
strideweave-verify-report = "strideweave.verification.cli:main"

[dependency-groups]
dev = [
    "clang-format==22.1.8",
    "numpy>=2.0",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    # The native-sanitizers job runs the instrumented suite in parallel. Only
    # that job passes -n; every other job runs pytest serially.
    "pytest-xdist>=3.6",
    "ruff>=0.14.10",
    "torch~=2.6.0",
    "types-pymysql>=1.1",
]
# Pinned to the maintained MkDocs 1.x continuation. Do NOT switch back to
# `mkdocs` unpinned: MkDocs 2.0 is a ground-up rewrite that drops plugin and
# theme compatibility, and it ships under the same PyPI name.
docs = [
    "properdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "PyYAML>=6.0",
]

[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/strideweave"]

[tool.ruff]
target-version = "py312"
line-length = 88
# These are exactly the directories the CI changed-paths gate treats as
# non-code, so a change confined to them skips the `test` job. Ruff's default
# discovery would still descend into them from the repository root, which
# would let a Python helper added under one of them land unformatted and then
# fail `test` for the next, unrelated change. The two sets have to agree.
extend-exclude = [
    ".agents",
    ".beads",
    ".claude",
    ".codex",
    "docs",
    "openspec",
]

[tool.ruff.lint]
extend-select = [
    "B017",
    "B905",
    "I",
    "PLC0414",
    "PT011",
    "PT012",
    "PYI011",
    "PYI026",
    "PYI034",
    "PYI035",
    "RUF022",
    "RUF043",
    "UP035",
]

[tool.ruff.lint.isort]
known-first-party = ["strideweave"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--durations=10"
doctest_optionflags = "NORMALIZE_WHITESPACE"
markers = [
    "dolt_integration: exercises a real local Dolt store on the shared session server (applied from fixture use)",
    "dolt_lifecycle: starts and stops its own managed Dolt servers",
]

[tool.uv]
required-version = ">=0.8.5"
