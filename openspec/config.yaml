schema: spec-driven

context: |
  StrideWeave uses OpenSpec as the normative source for observable system
  behavior. llms.md explains the current architecture and supported surface.
  INVARIANTS.md defines cross-cutting implementation constraints. Tests are
  executable evidence. Beads is the durable implementation and review queue.

  OpenSpec sits above the Beads lifecycle. A change contains a concise,
  non-normative proposal and normative delta specs. The specs are the sole
  authority for whether observable behavior is a feature or a bug. Beads owns
  implementation design, threat models, decomposition, dependencies,
  validation planning, and review work. A planner translates coherent specs
  into Beads through create-task; implementers use do-task, and reviewers
  evaluate the result against the effective specs and Beads acceptance criteria.

  This is a brownfield specification migration. Behavior absent from the main
  specs may be uncaptured rather than unsupported. Do not infer contractual
  intent from code or tests alone when the documentation and intended behavior
  are unclear.

rules:
  proposal:
    - "Treat the proposal as a concise non-normative change and capability index; it does not define behavioral correctness."
    - "Identify the exact new or modified capability paths."
    - "Distinguish baseline documentation capture from an actual behavior change."
    - "State whether the proposal captures confirmed behavior, introduces intended behavior, or reconciles conflicting evidence."
    - "Identify affected llms.md sections and relevant INVARIANTS.md IDs."
    - "Keep implementation design, threat models, validation plans, and task decomposition in Beads rather than the proposal."

  specs:
    - "Specify externally observable behavior, inputs, outputs, errors, and compatibility constraints."
    - "Use stable requirement names and testable WHEN/THEN scenarios."
    - "During baseline migration, include only behavior confirmed by documentation, tests or code evidence, and maintainer intent."
    - "Do not promote observed behavior to a contract when intent is unresolved."
    - "Do not embed implementation details, source layout, agent workflow, or Beads mechanics in normative requirements."
    - "Preserve existing capability paths when modifying accepted behavior."
    - "Treat terminology definitions as stable semantic primitives, not convenient summaries. Define each term precisely enough to capture its full intended role, essential dimensions, boundaries, and distinctions from neighboring concepts, so requirements can rely on it even as individual API semantics evolve."
    - "Name each requirement for the behavior it pins, not for a function. A public API function may span several requirements; never create a capability per function."
    - "Cover every public API function's contract completely within the capability that owns its domain, documenting semantically equivalent surfaces together with every name and syntax form, for example `matmul` and the `@` operator. Do not specify private implementation functions."
    - "Name every input explicitly and state its semantic definition outright, then add SHALL clauses that constrain it exactly. Never leave an input's meaning implicit or inferable only from its constraints."
    - "State what each function returns on success, including when it returns nothing."
    - "For an optional input, state that it is optional and give the value it SHALL default to. Do not write `SHALL accept an optional argument` and stop there."
    - "State every failure explicitly with the condition that triggers it and the observable failure, for example `SHALL fail with TypeError when ...`. Do not leave a failure implied by the absence of a success case."
    - "Assert what is true, not what is false. Write `SHALL be interpreted as a logical coordinate`, not `SHALL NOT be interpreted as a physical offset`; a negative construction never establishes the positive contract."
    - "Use one term per concept, matching the term used in llms.md and the public API, for example `size` rather than `logical cardinality`."

operations:
  apply:
    guidance:
      - "Direct OpenSpec application is not used in this repository."
      - "Stop after planning artifacts are coherent and hand the change to the planner for create-task."
      - "Implementation must proceed through Beads and do-task."

  archive:
    guidance:
      - "Archive only after the review bead and every implementation or fix bead are closed."
      - "Resolve the implementation graph through the exact Beads spec id openspec-change:<change-name>; missing, ambiguous, incompletely linked, or open work blocks archive and cannot be waived."
      - "Confirm the implementation was reviewed against the effective specs, invariants, and Beads acceptance criteria; use the proposal only to verify intended scope."
      - "Confirm required llms.md and INVARIANTS.md updates are present before archiving."
