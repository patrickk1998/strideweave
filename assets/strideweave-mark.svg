<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 166 166" width="166" height="166" role="img">
  <title>strideweave</title>
  <desc>Three vertical bars woven by a single continuous thread that turns twice, tracing an S — a strided traversal drawn as a weave.</desc>

  <defs>
    <!-- Weft. Vertical ramp: teal to purple = progression through the stride.
         Each row is one step. Do not rotate to horizontal — rows 1 and 3 are
         traversed right-to-left and the ramp would lie. -->
    <linearGradient id="weft" gradientUnits="userSpaceOnUse" x1="0" y1="38" x2="0" y2="122">
      <stop offset="0" stop-color="#1D9E75"/>
      <stop offset="0.5" stop-color="#378ADD"/>
      <stop offset="1" stop-color="#7F77DD"/>
    </linearGradient>

    <!-- Warp shading. One base value (#6E6D68) for every bar; varies only
         vertically. Lighter where the bar floats OVER the weft, darker where
         it dips UNDER. Rows sit at y=45 (0.281), y=80 (0.5), y=115 (0.719).
         warp-a = bars 1 and 3. warp-b = bar 2, inverted — that alternation is
         what makes it a plain weave.
         Bar rect and interlace patch share a gradient in the same user space,
         so they read as one continuous ribbon. -->
    <linearGradient id="warp-a" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160">
      <stop offset="0" stop-color="#6E6D68"/>
      <stop offset="0.281" stop-color="#5A5954"/>
      <stop offset="0.39" stop-color="#6E6D68"/>
      <stop offset="0.5" stop-color="#82817C"/>
      <stop offset="0.61" stop-color="#6E6D68"/>
      <stop offset="0.719" stop-color="#5A5954"/>
      <stop offset="1" stop-color="#6E6D68"/>
    </linearGradient>
    <linearGradient id="warp-b" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160">
      <stop offset="0" stop-color="#6E6D68"/>
      <stop offset="0.281" stop-color="#82817C"/>
      <stop offset="0.39" stop-color="#6E6D68"/>
      <stop offset="0.5" stop-color="#5A5954"/>
      <stop offset="0.61" stop-color="#6E6D68"/>
      <stop offset="0.719" stop-color="#82817C"/>
      <stop offset="1" stop-color="#6E6D68"/>
    </linearGradient>
  </defs>

  <g transform="translate(24,8)">
    <rect x="10" y="6" width="18" height="148" fill="url(#warp-a)"/>
    <rect x="50" y="6" width="18" height="148" fill="url(#warp-b)"/>
    <rect x="90" y="6" width="18" height="148" fill="url(#warp-a)"/>

    <!-- Row 1 right-to-left, turn left, row 2 left-to-right, turn right,
         row 3 right-to-left. Boustrophedon with alternating turns = S. -->
    <path d="M127.5 45 L8 45 A17.5 17.5 0 0 0 8 80 L110 80 A17.5 17.5 0 0 1 110 115 L-9.5 115"
          fill="none" stroke="url(#weft)" stroke-width="13" stroke-linecap="round"/>

    <rect x="50" y="37" width="18" height="16" fill="url(#warp-b)"/>
    <rect x="10" y="72" width="18" height="16" fill="url(#warp-a)"/>
    <rect x="90" y="72" width="18" height="16" fill="url(#warp-a)"/>
    <rect x="50" y="107" width="18" height="16" fill="url(#warp-b)"/>
  </g>
</svg>
