name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Neither trigger carries a `paths` filter, and neither may gain one. The
  # `main-protector` ruleset requires `test`, `duplication`,
  # `native-strict-warnings`, and `native-sanitizers` by name, and a workflow
  # that never starts never reports them, so a filtered trigger would leave a
  # documentation-only pull request waiting forever on checks that can no
  # longer arrive. The workflow therefore always starts and the individual
  # jobs skip instead: a job skipped by `if:` reports `skipped`, which
  # satisfies a required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      code: ${{ steps.filter.outputs.code }}
      block_device: ${{ steps.filter.outputs.block_device }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The two outputs are independently classified. Both are conservative:
      # an unrecognised path, missing base commit, failed or unreadable API
      # response, empty file list, or possibly truncated comparison runs the
      # corresponding jobs. The code output retains the existing deny list;
      # the block-device output adds a narrower set of paths proven unrelated
      # to that integration surface. Rename entries classify both endpoints.
      - name: Classify the changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.base.sha
            || github.event.before }}
          HEAD: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.sha
            || github.sha }}
        run: |
          # A `run:` step with no `shell:` key executes as `bash -e {0}`, so
          # errexit is on before the first line and `set -uo pipefail` does
          # not clear it. Clear it explicitly: every failure below has a
          # fail-open branch, and errexit would abort the step ahead of them
          # and leave no verdict in `$GITHUB_OUTPUT`.
          set +e
          set -uo pipefail

          emit() {
            echo "code=$1" >> "$GITHUB_OUTPUT"
            echo "block_device=$2" >> "$GITHUB_OUTPUT"
            echo "Changed-path gate: code=$1 block_device=$2"
            exit 0
          }

          # A push that creates a branch reports an all-zero base commit.
          zeroes="0000000000000000000000000000000000000000"
          if [ -z "${BASE}" ] || [ "${BASE}" = "${zeroes}" ]; then
            echo "No usable base commit; running the full CI."
            emit true true
          fi

          # The three-dot form of the compare endpoint diffs against the merge
          # base, which is what a pull request means by "changed files".
          if ! payload="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}?per_page=300")"
          then
            echo "Could not list the changed files; running the full CI."
            emit true true
          fi

          if [ -z "${payload}" ]; then
            echo "Empty compare response; running the full CI."
            emit true true
          fi

          if ! classification="$(printf '%s' "${payload}" \
            | python3 tools/classify_ci_paths.py)"
          then
            echo "Uncertain compare payload; running the full CI."
            emit true true
          fi

          code="$(printf '%s' "${classification}" | jq -r '.code')"
          block_device="$(printf '%s' "${classification}" \
            | jq -r '.block_device')"
          case "${code}:${block_device}" in
            true:true | true:false | false:true | false:false) ;;
            *)
              echo "Unreadable classification; running the full CI."
              emit true true
              ;;
          esac

          emit "${code}" "${block_device}"

  duplication:
    needs: changes
    # The comparison is against `false` rather than `true`, and `!cancelled()`
    # lets the job run even when `changes` failed, so a gate that crashes or
    # never writes its output runs the full CI instead of silently skipping
    # it. A gate failure must never look like a clean documentation change.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install duplication detector
        run: npm ci

      - name: Check production-source duplication
        run: npm run duplication

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      # The real-Dolt suites run in the dolt-integration job, which is the one
      # place that installs the runtime and starts a server. Only tests that
      # resolve a session-server fixture, or that start servers of their own,
      # carry those markers, so the store's pure helper, in-memory-double,
      # stand-in-runtime, and path-default tests still run here — as does all
      # report construction, binding, and provenance reconciliation. Metal
      # tests are separately hardware-gated because this job runs on Linux.
      - name: Run tests
        run: >-
          uv run pytest tests
          -m "not dolt_integration and not dolt_lifecycle and not metal and not block_device_integration"

      # --doctest-modules collects Python modules only. The 25 examples in
      # src/strideweave/core/native/_carrier.cpp remain an explicit native
      # pybind-docstring coverage gap and require a future custom collector.
      - name: Run Python docstring examples
        run: uv run pytest --doctest-modules src/strideweave

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Check repository invariants
        run: uv run python tools/lint_invariants.py

      - name: Check native formatting
        run: >-
          find src/strideweave -type f \( -name '*.cpp' -o -name '*.hpp' \)
          -exec uv run clang-format --dry-run --Werror {} +

      - name: Type check
        run: uv run pyright

      - name: Build distributions
        run: uv build

  dolt-integration:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOLT_VERSION: "2.2.3"
      DOLT_SHA256: >-
        ffafa7cc172cada5f77ca3fb96306545ddac44a111625f75f870306c7f197301

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          save-cache: false
          python-version: "3.12"

      - name: Install the pinned Dolt runtime
        run: |
          set -euo pipefail
          archive="dolt-linux-amd64.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/dolthub/dolt/releases/download/v${DOLT_VERSION}/${archive}" \
            -o "$archive"
          echo "${DOLT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive"
          sudo install dolt-linux-amd64/bin/dolt /usr/local/bin/dolt
          dolt version

      - name: Install dependencies
        run: uv sync --frozen --group dev

      # dolt_integration shares one managed server and asserts that exactly one
      # dolt sql-server runs and that no dolt sql subprocess is launched, so a
      # lifecycle regression fails here. dolt_lifecycle is the manager's own
      # test and deliberately starts, and may concurrently run, several
      # independently owned servers.
      - name: Run the real-Dolt suites
        run: >-
          uv run pytest tests
          -m "dolt_integration or dolt_lifecycle"

  block-device-integration:
    needs: changes
    # Like the required code jobs, a missing classifier output runs fail-open.
    # This job is intentionally not a required check, so its independent gate
    # can skip unrelated changes without changing the protected-job contract.
    if: ${{ !cancelled() && needs.changes.outputs.block_device != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          save-cache: false
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Exercise an exact disposable loop device as the runner user
        run: |
          set -euo pipefail

          test_root=""
          image=""
          canonical_image=""
          loop_device=""
          original_uid=""
          original_gid=""
          original_mode=""

          cleanup() {
            test_status=$?
            trap - EXIT INT TERM
            set +e
            cleanup_status=0

            if [[ -n "${loop_device}" ]]; then
              if [[ ! "${loop_device}" =~ ^/dev/loop[0-9]+$ ]]; then
                echo "Refusing cleanup of unexpected loop path: ${loop_device}"
                cleanup_status=1
              else
                bindings="$(sudo losetup -j "${canonical_image}" 2>/dev/null)"
                binding_count="$(printf '%s\n' "${bindings}" \
                  | sed '/^[[:space:]]*$/d' | wc -l)"

                # Restore only the exact node whose metadata was captured.
                if [[ -n "${original_uid}" && -b "${loop_device}" ]]; then
                  sudo chown "${original_uid}:${original_gid}" "${loop_device}" \
                    || cleanup_status=1
                  sudo chmod "${original_mode}" "${loop_device}" \
                    || cleanup_status=1
                fi

                if [[ "${binding_count}" -eq 1 \
                  && "${bindings}" == "${loop_device}:"* ]]; then
                  if sudo losetup -d "${loop_device}"; then
                    echo "Detached exact loop mapping: ${loop_device} -> ${canonical_image}"
                  else
                    cleanup_status=1
                  fi
                elif [[ -n "${bindings}" ]]; then
                  echo "Refusing to detach a loop mapping not owned by this job."
                  cleanup_status=1
                fi
              fi
            fi

            if [[ -e "${canonical_image}" ]] \
              && [[ -n "$(sudo losetup -j "${canonical_image}" 2>/dev/null)" ]]; then
              echo "Disposable image remains attached after cleanup."
              cleanup_status=1
            fi

            if [[ -n "${test_root}" ]]; then
              case "${test_root}" in
                "${RUNNER_TEMP}"/strideweave-block-device.*)
                  if rm -f "${image}" && rmdir "${test_root}"; then
                    echo "Removed exact disposable artifacts: ${image} ${test_root}"
                  else
                    cleanup_status=1
                  fi
                  ;;
                *)
                  echo "Refusing cleanup of unexpected directory: ${test_root}"
                  cleanup_status=1
                  ;;
              esac
            fi

            if [[ "${test_status}" -ne 0 ]]; then
              exit "${test_status}"
            fi
            exit "${cleanup_status}"
          }
          # Install every cleanup path before creating the first artifact.
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          test_root="$(mktemp -d "${RUNNER_TEMP}/strideweave-block-device.XXXXXX")"
          image="${test_root}/device.img"
          canonical_image="${image}"
          truncate -s 16M "${image}"
          canonical_image="$(readlink -f "${image}")"
          # Resolve and validate the exact cleanup target before attaching it.
          loop_device="$(sudo losetup --find)"
          [[ "${loop_device}" =~ ^/dev/loop[0-9]+$ ]]
          test -b "${loop_device}"
          sudo losetup "${loop_device}" "${canonical_image}"

          bindings="$(sudo losetup -j "${canonical_image}")"
          binding_count="$(printf '%s\n' "${bindings}" \
            | sed '/^[[:space:]]*$/d' | wc -l)"
          [[ "${binding_count}" -eq 1 ]]
          [[ "${bindings}" == "${loop_device}:"* ]]

          loop_name="${loop_device#/dev/}"
          sysfs_backing="$(cat "/sys/block/${loop_name}/loop/backing_file")"
          if [[ "${sysfs_backing}" == /* ]]; then
            sysfs_image="$(readlink -f "${sysfs_backing}")"
          else
            sysfs_image="$(readlink -f "/${sysfs_backing}")"
          fi
          [[ "${sysfs_image}" == "${canonical_image}" ]]
          ! findmnt -rn -S "${loop_device}" >/dev/null

          capacity="$(sudo blockdev --getsize64 "${loop_device}")"
          logical_block_size="$(sudo blockdev --getss "${loop_device}")"
          physical_block_size="$(sudo blockdev --getpbsz "${loop_device}")"
          [[ "${capacity}" -eq "$(stat -c '%s' "${canonical_image}")" ]]
          [[ "${capacity}" -eq 16777216 ]]
          [[ "${logical_block_size}" -gt 0 ]]
          [[ "${physical_block_size}" -ge "${logical_block_size}" ]]
          [[ $((physical_block_size % logical_block_size)) -eq 0 ]]
          echo "Verified disposable block device: node=${loop_device}" \
            "backing=${canonical_image} capacity=${capacity}" \
            "logical=${logical_block_size} physical=${physical_block_size}" \
            "unmounted=true"

          read -r original_uid original_gid original_mode \
            < <(stat -c '%u %g %a' "${loop_device}")
          sudo chown "$(id -u):$(id -g)" "${loop_device}"
          sudo chmod 600 "${loop_device}"
          test -r "${loop_device}"
          test -w "${loop_device}"

          STRIDEWEAVE_BLOCK_DEVICE="${loop_device}" \
            STRIDEWEAVE_BLOCK_DEVICE_CAPACITY="${capacity}" \
            .venv/bin/python -m pytest tests/test_block_device_integration.py -q

  native-strict-warnings:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          save-cache: false
          python-version: "3.12"

      - name: Build with strict native warnings
        env:
          CMAKE_ARGS: -DSTRIDEWEAVE_STRICT_WARNINGS=ON
        run: uv build

  native-sanitizers:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMAKE_ARGS: >-
        -DSTRIDEWEAVE_STRICT_WARNINGS=ON
        -DSTRIDEWEAVE_SANITIZERS=ON

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          save-cache: false
          python-version: "3.12"

      - name: Build sanitizer-instrumented extensions
        run: uv sync --frozen --group dev --reinstall-package strideweave

      # Sanitizers instrument StrideWeave's own extension modules. The real-Dolt
      # suites are deselected because their work happens inside an
      # uninstrumented external Dolt process, so running them here would cost
      # minutes and prove nothing about native StrideWeave code. Nothing native
      # leaves with them: tests/conftest.py makes every binding that reaches
      # sw.test_backend, native kernel metadata, the installed compilation
      # manifest, or report binding refuse to run inside a marked item, so those
      # suites persist pure-Python evidence and every test that does execute
      # native code — Stage One, report binding, certificate reconstruction,
      # provenance reconciliation, native metadata, CPU kernels — stays here.
      # The suite runs in parallel because sanitizers cost about 6.8x and that
      # cost is a long flat tail rather than a hot spot. --capture=no is gone
      # because xdist does not support it, so a sanitizer report can no longer
      # reach the log through the worker's own stderr. log_path replaces it:
      # each process writes <log_path>.<pid>, so a crashed worker leaves its
      # report on disk and the two failure steps below print and upload it. Do
      # not remove log_path without restoring another path for the report — the
      # report is the entire value of this job.
      #
      # Both option strings share one log_path prefix on purpose. ASan and UBSan
      # share a single runtime here, so they share the common log_path flag and
      # the last one parsed wins; giving them separate prefixes only mislabels
      # the file, putting an AddressSanitizer report in a "ubsan" one.
      #
      # STRIDEWEAVE_EXPECT_SANITIZERS makes tests/conftest.py assert, in the
      # controller and in every worker, that the process really did inherit the
      # preloaded runtime. A worker that escaped it would otherwise pass every
      # test while quietly reducing this job to an ordinary test run. The
      # Apple-silicon-only Metal selection cannot run in this Linux job.
      - name: Run tests with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          mkdir -p sanitizer-reports
          reports="$PWD/sanitizer-reports"
          asan_runtime="$(gcc -print-file-name=libasan.so)"
          cxx_runtime="$(g++ -print-file-name=libstdc++.so.6)"
          LD_PRELOAD="$asan_runtime:$cxx_runtime" \
            PYTHONMALLOC="malloc" \
            PYTHONUNBUFFERED="1" \
            STRIDEWEAVE_EXPECT_SANITIZERS="1" \
            ASAN_OPTIONS="abort_on_error=1:detect_leaks=0:halt_on_error=1:symbolize=1:log_path=$reports/sanitizer" \
            UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1:log_path=$reports/sanitizer" \
            .venv/bin/python -m pytest -n auto --maxfail=1 tests \
            -m "not dolt_integration and not dolt_lifecycle and not metal and not block_device_integration"

      # xdist names the test a crashed worker was running; these files carry the
      # sanitizer diagnosis for it. Printing them keeps the report readable in
      # the log without downloading the artifact.
      - name: Show sanitizer reports
        if: failure()
        run: |
          shopt -s nullglob
          reports=(sanitizer-reports/*)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No sanitizer report was written; the failure was not a" \
              "sanitizer diagnostic."
            exit 0
          fi
          for report in "${reports[@]}"; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done

      - name: Upload sanitizer reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitizer-reports
          path: sanitizer-reports/
          if-no-files-found: ignore
